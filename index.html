<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salão Unissex — Salão Brega e Chique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  // aplica o tema antes de desenhar a página (evita "piscar")
  (function(){
    var t = null;
    try { t = localStorage.getItem('salao_tema'); } catch(e) {}
    if (!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
    </div>
    <div>
      <div class="brand-name" id="brandName">Studio Unissex</div>
      <div class="brand-sub">Gestão do salão</div>
    </div>
  </div>

  <nav class="tabs" id="tabs" aria-label="Seções">
    <button data-tab="painel">Painel</button>
    <button data-tab="agenda">Agenda</button>
    <button data-tab="clientes">Clientes</button>
    <button data-tab="servicos">Serviços</button>
    <button data-tab="produtos">Produtos</button>
    <button data-tab="equipe">Equipe</button>
    <button data-tab="relatorios">Relatórios</button>
    <button data-tab="ajustes">Ajustes</button>
  </nav>

  <div class="top-actions">
    <span id="sync" class="sync" title="Situação dos dados">Carregando…</span>
    <div class="theme-switch" role="group" aria-label="Tema">
      <button type="button" class="theme-opt" data-tema="light" aria-pressed="false" title="Tema claro">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span>Claro</span>
      </button>
      <button type="button" class="theme-opt" data-tema="dark" aria-pressed="false" title="Tema escuro">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span>Escuro</span>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="page-head">
    <h1 id="pageTitle">Painel</h1>
    <div id="toolbar" class="toolbar"></div>
  </div>
  <div id="vbody"></div>
</main>

<footer class="rodape" id="rodape" aria-label="Dados do salão"></footer>

<button type="button" id="btnTopo" class="btn-topo" data-topo aria-label="Voltar ao topo" title="Voltar ao topo">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
</button>

<!-- Janela modal -->
<div id="overlay" class="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="modal-head">
      <h2 id="mTitle"></h2>
      <button class="icon-btn" type="button" data-close aria-label="Fechar">&times;</button>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>
</div>

<!-- Confirmação -->
<div id="confirmOv" class="overlay" hidden>
  <div class="modal small" role="alertdialog" aria-modal="true">
    <div class="modal-body">
      <p id="cMsg"></p>
      <div class="form-actions">
        <button type="button" class="btn ghost" id="cNo">Voltar</button>
        <button type="button" class="btn primary" id="cYes">Confirmar</button>
      </div>
    </div>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
